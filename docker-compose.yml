services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: payflow
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/payflow
      DATABASE_USERNAME: payflow
      DATABASE_PASSWORD: payflow
      JWT_SECRET: change-me-in-production-change-me-in-production-0123456789
      WEBHOOK_SECRET: change-me-webhook-secret
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
